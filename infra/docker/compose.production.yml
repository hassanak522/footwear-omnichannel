# Deploy behind a TLS reverse proxy. No database or API ports are published publicly.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["npm","exec","--workspace=@footwear/database","--","prisma","migrate","deploy"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      ONLINE_COD_SHIPPING_PKR: ${ONLINE_COD_SHIPPING_PKR:?Set shipping amount}
      LOYALTY_REDEMPTION_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["3001"]
    networks: [internal,edge]
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set public HTTPS API URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set public HTTPS API URL}
    expose: ["3000"]
    networks: [edge]
volumes:
  postgres_data:
networks:
  internal:
    internal: true
  edge:
